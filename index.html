<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151923">
  <title>軍儀 AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">GUNGI PROJECT</p>
      <h1>軍儀 AI</h1>
    </div>
    <span class="status" id="status">開発初期段階</span>
  </header>

  <main>
    <section class="panel intro">
      <h2>対局盤</h2>
      <p>盤面表示の試作です。駒の移動規則・段の処理・勝敗判定は、確認したルールに基づいて次の段階で実装します。</p>
    </section>

    <section class="board-wrap" aria-label="軍儀の盤面">
      <div class="board-coordinates" id="board"></div>
    </section>

    <section class="panel controls">
      <div class="control-heading">
        <h2>選択中のマス</h2>
        <strong id="selected">なし</strong>
      </div>
      <p id="cell-info">盤面のマスをタップしてください。</p>
      <button id="clear-selection" type="button">選択解除</button>
    </section>

    <section class="panel">
      <h2>開発ロードマップ</h2>
      <ol class="roadmap">
        <li class="active">盤面・局面データ構造</li>
        <li>駒の配置と段（ツケ）の管理</li>
        <li>合法手生成・王手判定</li>
        <li>局面評価関数</li>
        <li>探索エンジン（反復深化・枝刈り）</li>
        <li>対局・棋譜・AI強度設定</li>
      </ol>
    </section>
  </main>

  <footer>Gungi AI · 開発用プロトタイプ</footer>
  <script src="app.js"></script>
</body>
</html>
