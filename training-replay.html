<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151923"><title>学習対局ビューア | 軍儀 AI</title><link rel="stylesheet" href="style-20261107ar.css?v=20261108lasttwo1"><style>
.viewer-tools{display:grid;gap:10px}.viewer-tools input[type=file]{max-width:100%;padding:10px;background:#202938;border-radius:8px}.viewer-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px}.viewer-meta span{color:#c7d2e4}.viewer-board-wrap{max-width:720px;margin:0 auto}.viewer-board{pointer-events:none}.viewer-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.viewer-controls button{margin:0!important}.viewer-controls input{width:100%;accent-color:#b9c7e2}.viewer-move{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.viewer-list{padding-left:22px;max-height:260px;overflow:auto}.viewer-list li{padding:4px 0;font-size:12px;cursor:pointer}.viewer-list li.active{color:#fff;font-weight:700;background:#394866;border-radius:5px;padding-left:5px}.viewer-note{font-size:12px;line-height:1.7;color:#b9c4d5}
</style></head><body><header class="topbar"><div><p class="eyebrow">GUNGI PROJECT</p><h1>学習対局ビューア</h1></div><a href="./index.html">対局盤へ戻る</a></header><main>
<section class="panel"><h2>学習結果</h2><p>最新の学習結果を自動で読み込みます。必要な場合は、保存済みのJSONファイルから手動で読み込むこともできます。</p><div class="viewer-tools"><label for="report-file">学習レポート（JSON）</label><input id="report-file" type="file" accept=".json,application/json"><label for="game-select">再生する対局</label><select id="game-select" disabled><option>レポートを読み込んでください</option></select><p id="load-status" role="status" class="viewer-note">最新の学習結果を確認しています。</p></div></section>
<section class="panel"><div class="viewer-meta" id="game-meta"><span>対局情報はここに表示されます。</span></div></section>
<section class="panel"><h2>盤面再生</h2><div class="board-wrap viewer-board-wrap"><div id="viewer-board" class="board-coordinates viewer-board" aria-label="再生盤面"></div></div><div class="viewer-controls"><button id="first" disabled>|◀ 最初</button><button id="prev" disabled>◀ 1手戻る</button><button id="next" disabled>1手進む ▶</button><button id="last" disabled>最後 ▶|</button><input id="range" type="range" min="0" max="0" value="0" step="1" disabled></div><p id="frame-status" class="replay-status">局面データを読み込むと再生できます。</p><p id="move-info" class="viewer-move"></p></section>
<section class="panel"><h2>各手の一覧</h2><ol id="move-list" class="viewer-list"><li>棋譜データがありません。</li></ol></section>
<section class="panel"><p class="viewer-note">保存された各手の直前の盤面と最終局面を再生します。探索木そのものではなく、AIが実際に選んだ手を確認する機能です。</p></section></main><script src="./training-replay.js?v=20261111autolast1"></script></body></html>
