name: Engine regression tests

on:
  push:
    branches: [main]
    paths:
      - "engine-20261107bb.js"
      - "search-20261108cycle3.js"
      - "evaluation-20261107be.js"
      - "scripts/search-context-regression.mjs"
      - "scripts/movegen-regression.mjs"
      - "training-worker-20261107a.js"
      - "training-20261107a.js"
      - "tournament-20261107a.js"
      - "scripts/server-training.mjs"
      - "scripts/autonomous-improvement.mjs"
      - ".github/workflows/autonomous-improvement.yml"
      - ".github/workflows/engine-regression.yml"
  pull_request:
    paths:
      - "engine-20261107bb.js"
      - "search-20261108cycle3.js"
      - "scripts/search-context-regression.mjs"
      - "scripts/movegen-regression.mjs"
      - "scripts/autonomous-improvement.mjs"
      - ".github/workflows/autonomous-improvement.yml"
      - ".github/workflows/engine-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check autonomous controller syntax
        run: node --check scripts/autonomous-improvement.mjs
      - name: Test history-sensitive transposition keys
        run: node scripts/search-context-regression.mjs
      - name: Test optimized move generation against reference implementation
        run: node scripts/movegen-regression.mjs
